<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 312" role="img" aria-labelledby="title desc">
  <title id="title">Mac Extend video pipeline</title>
  <desc id="desc">The MacBook creates and captures a virtual display, encodes H.264, and sends frames over encrypted Thunderbolt Bridge to AVFoundation on the iMac.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#27618e"/></marker>
  </defs>
  <rect width="1000" height="312" rx="22" fill="#f2f7fb"/>
  <g font-family="system-ui, sans-serif" fill="#14283b">
    <text x="28" y="43" font-size="24" font-weight="700">From virtual desktop to iMac panel</text>
    <rect x="28" y="67" width="470" height="174" rx="16" fill="#e0eefc"/>
    <rect x="514" y="67" width="218" height="174" rx="16" fill="#def4ee"/>
    <rect x="748" y="67" width="224" height="174" rx="16" fill="#e8eafb"/>
    <g font-size="17" font-weight="700">
      <text x="44" y="97">MacBook Pro</text>
      <text x="530" y="97">Direct cable</text>
      <text x="764" y="97">iMac</text>
    </g>
    <g fill="#fff" stroke="#c5d7e6">
      <rect x="44" y="120" width="128" height="82" rx="10"/>
      <rect x="199" y="120" width="130" height="82" rx="10"/>
      <rect x="356" y="120" width="126" height="82" rx="10"/>
      <rect x="531" y="120" width="184" height="82" rx="10"/>
      <rect x="765" y="120" width="190" height="82" rx="10"/>
    </g>
    <g stroke="#27618e" stroke-width="2" marker-end="url(#arrow)">
      <path d="M173 161H194"/><path d="M330 161H351"/><path d="M483 161H526"/><path d="M716 161H760"/>
    </g>
    <g text-anchor="middle" font-weight="650" font-size="14">
      <text x="108" y="151">Create display</text><text x="264" y="151">Capture frames</text>
      <text x="419" y="151">Encode H.264</text><text x="623" y="151">Thunderbolt Bridge</text>
      <text x="860" y="151">Decode and present</text>
    </g>
    <g text-anchor="middle" fill="#40596d" font-size="13">
      <text x="108" y="176">CoreGraphics</text><text x="264" y="176">ScreenCaptureKit</text>
      <text x="419" y="176">VideoToolbox</text><text x="623" y="176">Paired TLS over TCP</text>
      <text x="860" y="176">AVFoundation</text>
    </g>
    <text x="28" y="280" font-size="16" fill="#40596d">The MacBook captures the virtual display and cursor. The iMac renders the received frames full-screen.</text>
  </g>
</svg>
